<style>:root{--bg:#f7f7fd;--fg:#1b1b2f;--mut:#4a4a63;--card:#fff;--bd:#cfcfe8;--link:#3730a3;--btn:#4338ca;--btnfg:#fff;--chip:#e8e8fa;--hero:#eceafd;--hdr:rgba(247,247,253,.88);--b1:rgba(129,118,255,.42);--b2:rgba(45,212,191,.34);--b3:rgba(244,114,182,.30);--glow:rgba(67,56,202,.22);--sh:0 10px 28px rgba(40,30,120,.14)}

*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg);background:var(--bg);overflow-x:hidden}
a{color:var(--link)}img{max-width:100%;height:auto}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.skip{position:absolute;left:-999px;top:0;background:var(--btn);color:var(--btnfg);padding:10px 14px;z-index:99}.skip:focus{left:8px;top:8px}
header.top{position:sticky;top:0;z-index:30;background:var(--hdr);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}

.menu{display:none;min-height:44px;min-width:44px;padding:0 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
#pg{position:absolute;left:0;bottom:-1px;height:3px;width:100%;background:var(--btn);transform:scaleX(var(--sp,0));transform-origin:left;opacity:0}
.mo #pg{opacity:1}
.hero{position:relative;overflow:hidden;background:var(--hero);padding:40px 0 44px}
.blobs{position:absolute;inset:0;pointer-events:none}

.blobs i:nth-child(2){right:-14%;top:-8%;background:radial-gradient(circle at 50% 50%,var(--b2),transparent 66%)}
.blobs i:nth-child(3){left:22%;bottom:-46%;background:radial-gradient(circle at 50% 50%,var(--b3),transparent 66%)}

.role{font-size:clamp(19px,3.4vw,26px);font-weight:700;margin:0 0 4px}
.loc{color:var(--mut);margin:0 0 14px}
.focus{margin:0 0 14px;font-size:18px;color:var(--mut)}
.rot{display:inline-grid;vertical-align:bottom}.rot span{grid-area:1/1;font-weight:700;color:var(--link)}
.rot span+span{display:none}

.btns{display:flex;flex-wrap:wrap;gap:12px;margin:0}

.ph{position:absolute;width:41%;perspective:700px}
.ph:nth-child(1){left:0;top:12%;rotate:-7deg;z-index:1}
.ph:nth-child(2){left:30%;top:0;z-index:3}
.ph:nth-child(3){right:0;top:14%;rotate:7deg;z-index:2}
.phone{border:5px solid #15151f;border-radius:22px;background:#15151f;overflow:hidden;box-shadow:var(--sh);transition:transform .3s}
.phone img{display:block;width:100%;height:auto;border-radius:16px}
.stats{border-bottom:1px solid var(--bd)}
.stats ul{list-style:none;margin:0;padding:22px 0;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.stats b{display:block;font-size:clamp(30px,6vw,44px);line-height:1.1;color:var(--link)}.stats span{color:var(--mut)}
section{padding:40px 0;scroll-margin-top:60px}section+section{border-top:1px solid var(--bd)}
h2{font-size:clamp(24px,4.4vw,32px);margin:0 0 10px;line-height:1.2}h3{font-size:19px;margin:28px 0 12px}
.sub{color:var(--mut);margin:0 0 8px;max-width:42em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}

.chips button[aria-pressed=true]{background:var(--btn);color:var(--btnfg);border-color:var(--btn)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px;list-style:none;margin:0;padding:0}
.card,ul.why li{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px}
.card{display:flex;flex-direction:column;gap:8px}
.ch{display:flex;gap:12px;align-items:center}.ch img{border-radius:14px;flex:none}
.card h4{margin:0;font-size:17px;line-height:1.3}.card p{margin:0;color:var(--mut);font-size:15px}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--chip);color:var(--mut);margin-top:2px}
.acts{margin-top:auto;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;padding-top:6px}
.acts a.l{display:inline-flex;align-items:center;min-height:44px}
.play{display:inline-flex;flex-direction:column;justify-content:center;min-height:44px;padding:2px 14px;border-radius:8px;background:#000;color:#fff;text-decoration:none;font-size:11px;line-height:1.15;border:1px solid #888}
.play b{font-size:16px}
.soon{display:inline-flex;align-items:center;min-height:44px;color:var(--mut);font-size:14px}

ul.why b{display:block}
ul.net li{margin:8px 0}
.tl{position:relative;list-style:none;margin:16px 0;padding:0 0 0 22px}
.tl::before,.tl::after{content:"";position:absolute;left:0;top:4px;bottom:4px;width:2px}
.tl::before{background:var(--bd)}.tl::after{background:var(--btn);transform-origin:top;transform:scaleY(var(--p,1))}
.tl li{position:relative;margin:0 0 18px;padding-left:4px}
.tl li::before{content:"";position:absolute;left:-28px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:3px solid var(--btn)}
.tl b{display:block}.tl .when{color:var(--mut);font-size:15px}.tl p{margin:4px 0 0;color:var(--mut);font-size:15px}
.skills{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:12px 0;padding:0}
.skills li{padding:4px 12px;border-radius:16px;border:1px solid var(--bd);background:var(--chip);color:var(--fg);font-size:15px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--bd);color:var(--mut);margin-left:6px}
ul.plain{margin:12px 0;padding-left:20px}ul.plain li{margin:8px 0}
p.bio{max-width:40em;font-size:17px}
.fig{margin:20px 0 0;padding:14px;border:1px solid var(--bd);border-radius:18px;background:var(--card)}
.fig svg{display:block;width:100%;height:auto;max-width:640px;margin:0 auto}.fig figcaption{color:var(--mut);font-size:15px;margin-top:8px}
.s-belt{fill:var(--chip);stroke:var(--bd)}.s-box{fill:var(--btn)}.s-dev{fill:var(--card);stroke:var(--btn);stroke-width:2}.s-twin{fill:none;stroke:var(--link);stroke-width:2;stroke-dasharray:6 6}
.s-sig{fill:none;stroke:var(--link);stroke-width:2;stroke-dasharray:4 8}.s-t{fill:var(--fg);font:600 18px system-ui,sans-serif}.s-led{fill:var(--link)}.s-dash{stroke:var(--mut);stroke-width:2;stroke-dasharray:8 10}
.flow{list-style:none;margin:22px 0;padding:0;display:grid;gap:34px;counter-reset:f}
.flow li{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
.flow b{display:block}.flow span.d{display:block;color:var(--mut);font-size:15px;margin-top:2px}
.flow li:not(:last-child)::after{content:"\2193";position:absolute;left:50%;bottom:-30px;translate:-50% 0;color:var(--link);font-size:24px;line-height:1;opacity:.5}
.note{border-left:4px solid var(--btn);padding:4px 0 4px 14px;color:var(--mut);max-width:44em}
.mqw{overflow:hidden;margin:18px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.mq{display:flex;flex:none;width:max-content;gap:14px;list-style:none;margin:0;padding:6px 14px 6px 0}
.mq li{flex:none}.mq a{display:block;border-radius:16px}.mq img{display:block;border-radius:14px}
.mq.cp{display:none}
.galw{position:relative}
ul.gal{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;list-style:none;margin:16px 0 0;padding:0 0 12px}
.gal li{flex:0 0 min(62%,230px);scroll-snap-align:start;margin:0}
.gal figure{margin:0}.gal img{display:block;width:100%;height:auto;border-radius:16px;border:1px solid var(--bd)}
.gal figcaption{padding:6px 2px;font-size:15px}.gal figcaption a{display:inline-flex;align-items:center;min-height:44px}
.gb{display:none;gap:10px;margin-top:4px}.js .gb{display:flex}
.gb button{min-width:48px;min-height:48px;border-radius:50%;border:2px solid var(--link);background:transparent;color:var(--link);font:700 20px system-ui;cursor:pointer}
footer{border-top:1px solid var(--bd);padding:28px 0 40px;color:var(--mut);font-size:15px}
footer ul{list-style:none;display:flex;flex-wrap:wrap;gap:0 10px;padding:0;margin:0 0 10px}footer a{display:inline-flex;align-items:center;min-height:44px}
@media (max-width:759px){.js .menu{display:inline-flex;align-items:center}.js nav{width:100%}.js nav ul{display:none;flex-direction:column;padding-bottom:8px}.js nav.open ul{display:flex}}
@media (min-width:760px){.hg{grid-template-columns:1.15fr .85fr;gap:36px}.hero{padding:64px 0 68px}.gal li{flex-basis:220px}}
@media (min-width:980px){.flow{grid-template-columns:repeat(5,1fr);gap:30px}.flow li:not(:last-child)::after{content:"\2192";left:auto;right:-26px;bottom:auto;top:50%;translate:0 -50%}}
@media (prefers-reduced-motion:no-preference){
.blobs i:nth-child(1){animation:bl1 18s ease-in-out infinite alternate}.blobs i:nth-child(2){animation:bl1 22s ease-in-out -6s infinite alternate-reverse}.blobs i:nth-child(3){animation:bl1 26s ease-in-out -12s infinite alternate}
@keyframes bl1{to{transform:translate(8%,10%) scale(1.15)}}
.rot span{opacity:0;animation:rot 12s infinite}.rot span+span{display:block}.rot span:nth-child(2){animation-delay:3s}.rot span:nth-child(3){animation-delay:6s}.rot span:nth-child(4){animation-delay:9s}
@keyframes rot{0%{opacity:0;transform:translateY(10px)}4%,22%{opacity:1;transform:none}26%,100%{opacity:0;transform:translateY(-10px)}}
.ph{animation:fl 6s ease-in-out infinite}.ph:nth-child(2){animation-delay:-2s}.ph:nth-child(3){animation-delay:-4s}
@keyframes fl{50%{translate:0 -12px}}
.ph:hover .phone{transform:rotateY(-10deg) rotateX(5deg) scale(1.04)}
.card,ul.why li{transition:transform .2s,box-shadow .2s}.card:hover,ul.why li:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.btn{transition:transform .15s}.btn:hover{transform:translateY(-2px)}
.mq{animation:mq 70s linear infinite}.mq.cp{display:flex;animation-name:mq}.mqw:hover .mq,.mqw:focus-within .mq{animation-play-state:paused}
.mqw{display:flex}
@keyframes mq{to{transform:translateX(-100%)}}
.s-dash{animation:dsh 1s linear infinite}.s-sig{animation:dsh 1.4s linear infinite}
@keyframes dsh{to{stroke-dashoffset:-18}}
.s-box{animation:mv 6s linear infinite}.s-box:nth-of-type(2){animation-delay:-2s}.s-box:nth-of-type(3){animation-delay:-4s}
@keyframes mv{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(330px);opacity:0}}
.s-mini{animation:mv2 3s linear infinite}@keyframes mv2{0%{transform:translateX(0);opacity:0}10%,90%{opacity:1}100%{transform:translateX(120px);opacity:0}}
.s-led{animation:led 1.6s steps(2,start) infinite}.s-led:nth-of-type(2){animation-delay:.5s}.s-led:nth-of-type(3){animation-delay:1s}
@keyframes led{50%{opacity:.2}}
.flow li{animation:lit 7s infinite;animation-delay:calc(var(--i)*1.2s)}.flow li::after{animation:arw 7s infinite;animation-delay:calc(var(--i)*1.2s + .6s)}
@keyframes lit{0%,15%{border-color:var(--btn);box-shadow:0 0 0 4px var(--glow)}20%,100%{border-color:var(--bd);box-shadow:none}}
@keyframes arw{0%{opacity:.4}8%{opacity:1}20%,100%{opacity:.4}}
.mo .rv{opacity:0;transform:translateY(20px);transition:opacity .6s ease,transform .6s ease;transition-delay:calc(var(--i,0)*70ms)}
.mo .rv.in{opacity:1;transform:none}
.mo .tl::after{transition:transform .15s linear}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important;scroll-behavior:auto!important}.mq.cp{display:none}.mqw{overflow:visible;-webkit-mask-image:none;mask-image:none}.mq{width:auto;flex-wrap:wrap}.rot{display:inline}.rot span,.rot span+span{display:inline}.rot span+span::before{content:" \00b7 ";font-weight:400;color:var(--mut)}}</style>

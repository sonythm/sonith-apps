<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moved to the home page | Sonith Manakkat</title>
<meta name="robots" content="noindex,follow">
<meta name="color-scheme" content="light dark">
<meta http-equiv="refresh" content="0; url=/sonith-apps/">
<link rel="canonical" href="https://sonythm.github.io/sonith-apps/">
<style>:root{--bg:#f7f7fd;--fg:#1b1b2f;--mut:#4a4a63;--card:#fff;--bd:#dcdcf0;--link:#3730a3;--btn:#4338ca;--btnfg:#fff;--chip:#e8e8fa;--hero:#e6e6fb}
@media (prefers-color-scheme:dark){:root{--bg:#12121c;--fg:#ececf8;--mut:#b4b4cc;--card:#1b1b2b;--bd:#33334d;--link:#b4bbff;--btn:#b4bbff;--btnfg:#12121c;--chip:#2a2a40;--hero:#1d1d33}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg);background:var(--bg)}
a{color:var(--link)}img{max-width:100%;height:auto}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
.skip{position:absolute;left:-999px;top:0;background:var(--btn);color:var(--btnfg);padding:10px 14px;z-index:9}.skip:focus{left:8px;top:8px}
header.top{border-bottom:1px solid var(--bd)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 16px}
.brand{display:inline-flex;align-items:center;gap:10px;min-height:48px;font-weight:700;color:var(--fg);text-decoration:none}
.brand img{border-radius:8px}
nav ul{display:flex;flex-wrap:wrap;gap:0 4px;list-style:none;margin:0;padding:0}
nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 10px}
.hero{background:var(--hero);padding:44px 0 40px}
h1{font-size:clamp(28px,6vw,44px);line-height:1.15;margin:0 0 14px;max-width:18em}
.lead{font-size:18px;color:var(--mut);max-width:36em;margin:0 0 24px}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:12px;background:var(--btn);color:var(--btnfg);font-weight:700;text-decoration:none;border:2px solid var(--btn)}
.btn.alt{background:transparent;color:var(--link);border-color:var(--link)}
a:focus-visible,button:focus-visible{outline:3px solid var(--link);outline-offset:2px}
section{padding:36px 0}section+section{border-top:1px solid var(--bd)}
h2{font-size:26px;margin:0 0 8px}h3{font-size:19px;margin:28px 0 12px}
.sub{color:var(--mut);margin:0 0 8px;max-width:42em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.chips button{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--bd);background:var(--chip);color:var(--fg);font:inherit;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--btn);color:var(--btnfg);border-color:var(--btn)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px;list-style:none;margin:0;padding:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.ch{display:flex;gap:12px;align-items:center}.ch img{border-radius:14px;flex:none}
.card h4{margin:0;font-size:17px;line-height:1.3}.card p{margin:0;color:var(--mut);font-size:15px}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--chip);color:var(--mut);margin-top:2px}
.acts{margin-top:auto;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;padding-top:6px}
.acts a.l{display:inline-flex;align-items:center;min-height:44px}
.play{display:inline-flex;flex-direction:column;justify-content:center;min-height:44px;padding:2px 14px;border-radius:8px;background:#000;color:#fff;text-decoration:none;font-size:11px;line-height:1.15;border:1px solid #888}
.play b{font-size:16px}
.soon{display:inline-flex;align-items:center;min-height:44px;color:var(--mut);font-size:14px}
ul.why{list-style:none;padding:0;margin:16px 0;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr))}
ul.why li{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}ul.why b{display:block}
ul.net li{margin:8px 0}
.tl{list-style:none;margin:16px 0;padding:0 0 0 18px;border-left:2px solid var(--bd)}
.tl li{margin:0 0 18px;padding-left:4px}.tl b{display:block}.tl .when{color:var(--mut);font-size:15px}.tl p{margin:4px 0 0;color:var(--mut);font-size:15px}
.skills{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:12px 0;padding:0}
.skills li{padding:4px 12px;border-radius:16px;border:1px solid var(--bd);background:var(--chip);color:var(--fg);font-size:15px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--bd);color:var(--mut);margin-left:6px}
ul.plain{margin:12px 0;padding-left:20px}ul.plain li{margin:8px 0}
footer{border-top:1px solid var(--bd);padding:28px 0 40px;color:var(--mut);font-size:15px}
footer ul{list-style:none;display:flex;flex-wrap:wrap;gap:0 10px;padding:0;margin:0 0 10px}footer a{display:inline-flex;align-items:center;min-height:44px}
.gal{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;list-style:none;margin:16px 0 0;padding:0 0 12px;-webkit-overflow-scrolling:touch}.gal li{flex:0 0 min(70%,240px);scroll-snap-align:start;margin:0}.gal figure{margin:0}.gal img{display:block;width:100%;height:auto;border-radius:16px;border:1px solid var(--bd)}.gal figcaption{padding:6px 2px;font-size:15px}.gal figcaption a{display:inline-flex;align-items:center;min-height:44px}
@media (min-width:800px){.gal{display:grid;grid-template-columns:repeat(6,1fr);overflow:visible}.gal li{flex:none}}
.role{font-size:22px;font-weight:700;margin:0 0 4px}.loc{color:var(--mut);margin:0 0 16px}p.bio{max-width:40em;font-size:17px}nav a[aria-current=page]{font-weight:700;text-decoration:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}</style>
</head>
<body><main id="main" class="wrap" style="padding-top:48px;padding-bottom:48px">
<h1>This page has moved</h1>
<p class="lead">My profile is now the home page. <a href="/sonith-apps/">Go to the home page</a>.</p>
</main></body>
</html>
